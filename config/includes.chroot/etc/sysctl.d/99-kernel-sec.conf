# Kernel Sec OS -- runtime policy, axis 1 (permissive capabilities)
# ptrace_scope=0: classic scope, any process may ptrace another process
# of the same UID. Required for gdb/radare2/frida to work without
# friction. See arch/x86/configs/kernel-sec-runtime-policy.md in the
# linux-6.12.41 tree for the full rationale.
kernel.yama.ptrace_scope = 0
